<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" role="img" aria-labelledby="title desc">
  <title id="title">The little in-between</title>
  <desc id="desc">A flat-lay of two polaroids, handwritten notes, two coffee cups and dried flowers on a rose-coloured table.</desc>

  <defs>
    <linearGradient id="table" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6ccd2"/>
      <stop offset="0.5" stop-color="#edb4c0"/>
      <stop offset="1" stop-color="#dfa0b0"/>
    </linearGradient>
    <radialGradient id="light" cx="0.2" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#fff6e9" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff6e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9c9a6"/>
      <stop offset="0.55" stop-color="#ef8f8f"/>
      <stop offset="1" stop-color="#8a3a54"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1138"/>
      <stop offset="0.6" stop-color="#5a1c3c"/>
      <stop offset="1" stop-color="#8f3a4d"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#fdf1e5"/>
    </linearGradient>
    <radialGradient id="coffee" cx="0.45" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#a86e53"/>
      <stop offset="0.7" stop-color="#6e3d2e"/>
      <stop offset="1" stop-color="#4b241d"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e2b7"/>
      <stop offset="0.55" stop-color="#d3ad64"/>
      <stop offset="1" stop-color="#9d7430"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#6d2439" flood-opacity="0.28"/>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#6d2439" flood-opacity="0.22"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="900" height="900" fill="url(#table)"/>
  <rect width="900" height="900" fill="url(#light)"/>

  <!-- scattered tiny hearts and specks -->
  <g fill="#b01640" opacity="0.4">
    <path d="M92 196c-6-5-10-8-10-13 0-3 2-6 6-6 2 0 3 1 4 3 1-2 3-3 5-3 3 0 5 2 5 6 0 5-4 8-10 13z" transform="scale(0.8) translate(120 140)"/>
    <path d="M744 420c-5-4-8-7-8-11 0-3 2-5 5-5 2 0 3 1 3 2 1-1 2-2 4-2 2 0 4 2 4 5 0 4-3 7-8 11z" opacity="0.6"/>
    <path d="M816 246c-4-3-6-5-6-8 0-2 1-4 4-4 2 0 2 1 3 2 0-1 1-2 3-2s3 2 3 4c0 3-2 5-7 8z" opacity="0.5"/>
    <circle cx="70" cy="470" r="3" opacity="0.45"/>
    <circle cx="520" cy="70" r="2.5" opacity="0.4"/>
    <circle cx="830" cy="520" r="3" opacity="0.35"/>
    <circle cx="170" cy="760" r="2.5" opacity="0.35"/>
  </g>

  <!-- main polaroid -->
  <g transform="rotate(-6 305 365)" filter="url(#shadow)">
    <rect x="120" y="130" width="370" height="470" rx="6" fill="url(#paper)"/>
    <rect x="144" y="154" width="322" height="350" fill="url(#sunset)"/>
    <!-- photo scene -->
    <circle cx="330" cy="330" r="56" fill="#ffe2ad" opacity="0.95"/>
    <path d="M144 504l96-120 66 66 54-48 106 102v0H144z" fill="#6f2a44" opacity="0.85"/>
    <path d="M144 504l72-70 62 44 74-58 114 84v0H144z" fill="#42172c" opacity="0.9"/>
    <g fill="#2a0c1b">
      <circle cx="282" cy="430" r="12"/>
      <path d="M262 504c2-38 8-62 20-62s18 24 20 62z"/>
      <circle cx="322" cy="442" r="10"/>
      <path d="M305 504c1-30 7-48 17-48s16 18 17 48z"/>
    </g>
    <ellipse cx="302" cy="492" rx="54" ry="8" fill="#1d0710" opacity="0.4"/>
    <text x="305" y="562" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="34" fill="#6b3a45">us, always</text>
  </g>

  <!-- smaller night polaroid -->
  <g transform="rotate(6 660 285)" filter="url(#shadow)">
    <rect x="520" y="100" width="280" height="360" rx="6" fill="url(#paper)"/>
    <rect x="542" y="122" width="236" height="260" fill="url(#night)"/>
    <circle cx="704" cy="196" r="36" fill="#f7e5bf"/>
    <circle cx="690" cy="182" r="9" fill="#e3c99d" opacity="0.5"/>
    <circle cx="716" cy="210" r="11" fill="#e3c99d" opacity="0.4"/>
    <g fill="#ffe9c4">
      <circle cx="590" cy="170" r="2.2" opacity="0.9"/>
      <circle cx="624" cy="230" r="1.5" opacity="0.7"/>
      <circle cx="660" cy="150" r="1.4" opacity="0.6"/>
      <circle cx="740" cy="260" r="2" opacity="0.8"/>
      <circle cx="576" cy="280" r="1.5" opacity="0.55"/>
      <circle cx="756" cy="164" r="1.3" opacity="0.6"/>
      <circle cx="704" cy="306" r="1.7" opacity="0.7"/>
    </g>
    <path d="M542 330l70-66 46 34 40-28 82 60v0H542z" fill="#260a19" opacity="0.95"/>
    <text x="660" y="430" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="25" fill="#6b3a45">under the same sky</text>
  </g>

  <!-- handwritten note -->
  <g transform="rotate(3 465 695)" filter="url(#shadow)">
    <rect x="300" y="555" width="330" height="285" rx="4" fill="url(#paper)"/>
    <path d="M300 555h330l-70 34H300z" fill="#f4e1d2" opacity="0.7"/>
    <g stroke="#c9929f" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.75">
      <path d="M334 628c34-8 66-8 100 0s66 8 100-1 54-7 62 0"/>
      <path d="M334 664c24-6 46-6 70-1s50 5 74-1 58-4 80 2"/>
      <path d="M334 700c30-7 58-7 88-1s58 6 88-1 48-5 60 1"/>
      <path d="M334 736c20-5 38-5 58 0s40 5 60 0"/>
    </g>
    <path d="M470 782c-10-8-16-12-16-20 0-5 4-9 9-9 3 0 6 2 7 4 1-2 4-4 7-4 5 0 9 4 9 9 0 8-6 12-16 20z" fill="#b01640" opacity="0.85"/>
    <g stroke="#b58a54" stroke-width="1.4" opacity="0.5">
      <path d="M598 574l6 26M608 584l-4 24"/>
    </g>
  </g>

  <!-- coffee cups -->
  <g filter="url(#softShadow)">
    <g transform="translate(660 712)">
      <circle r="62" fill="#fff8f0"/>
      <circle r="53" fill="#f3e2d3"/>
      <circle r="43" fill="url(#coffee)"/>
      <circle r="43" fill="none" stroke="#e9d4c2" stroke-width="3"/>
      <path d="M43 8c22-2 34 10 32 26-2 15-16 24-34 22" fill="none" stroke="#fff8f0" stroke-width="13" stroke-linecap="round"/>
      <path d="M52 10c18 0 28 10 26 22-1 11-12 18-26 16" fill="none" stroke="#e6cbb7" stroke-width="2" opacity="0.5"/>
      <ellipse cx="-8" cy="-8" rx="16" ry="9" fill="#c99174" opacity="0.35" transform="rotate(-25)"/>
    </g>
    <g transform="translate(788 790) scale(0.78)">
      <circle r="62" fill="#fff8f0"/>
      <circle r="53" fill="#f3e2d3"/>
      <circle r="43" fill="url(#coffee)"/>
      <path d="M43 8c22-2 34 10 32 26-2 15-16 24-34 22" fill="none" stroke="#fff8f0" stroke-width="14" stroke-linecap="round"/>
      <ellipse cx="-8" cy="-8" rx="16" ry="9" fill="#c99174" opacity="0.3" transform="rotate(-25)"/>
    </g>
    <!-- steam -->
    <g fill="none" stroke="#fff8f0" stroke-width="4" stroke-linecap="round" opacity="0.65">
      <path d="M636 626c-14-18 10-28-4-48"/>
      <path d="M664 616c-12-16 8-24-2-42"/>
      <path d="M760 706c-10-14 8-22-1-38"/>
    </g>
  </g>

  <!-- dried flowers -->
  <g filter="url(#softShadow)">
    <g stroke="#7c6a3c" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M128 862c18-92 52-174 104-244"/>
      <path d="M126 862c34-78 78-142 136-192"/>
      <path d="M130 862c8-72 26-132 52-180"/>
    </g>
    <g fill="#b08a54" opacity="0.9">
      <ellipse cx="188" cy="740" rx="24" ry="9" transform="rotate(-42 188 740)"/>
      <ellipse cx="214" cy="700" rx="20" ry="8" transform="rotate(-36 214 700)"/>
      <ellipse cx="240" cy="662" rx="17" ry="7" transform="rotate(-30 240 662)"/>
      <ellipse cx="160" cy="790" rx="20" ry="8" transform="rotate(-50 160 790)"/>
    </g>
    <g fill="#d8b6a0">
      <circle cx="232" cy="618" r="12"/>
      <circle cx="250" cy="606" r="9"/>
      <circle cx="226" cy="600" r="8"/>
      <circle cx="246" cy="630" r="7"/>
      <circle cx="272" cy="652" r="10"/>
      <circle cx="262" cy="670" r="7"/>
    </g>
    <g fill="#f3dcc4" opacity="0.85">
      <circle cx="232" cy="618" r="5"/>
      <circle cx="272" cy="652" r="4"/>
    </g>
    <path d="M128 862c8 12 18 18 30 18" stroke="#7c6a3c" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- little gold ring -->
  <g transform="rotate(-12 700 560)" filter="url(#softShadow)">
    <circle cx="700" cy="560" r="24" fill="none" stroke="url(#ring)" stroke-width="7"/>
    <path d="M700 530l-9 10h18z" fill="#e7cfa3"/>
    <path d="M691 540h18l-9 13z" fill="#b01640" opacity="0.8"/>
    <circle cx="700" cy="530" r="2.5" fill="#fff8e8"/>
  </g>

  <rect width="900" height="900" fill="none" stroke="#fff1e5" opacity="0.35" stroke-width="2"/>
  <rect width="900" height="900" filter="url(#grain)" opacity="0.1" style="mix-blend-mode:soft-light"/>
</svg>
